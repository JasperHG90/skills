repos:
  - repo: local
    hooks:
      - id: strip-invisible-unicode
        name: strip invisible unicode
        entry: python scripts/strip_invisible_unicode.py
        language: python
        types: [text]
      # apm installs a single file only by its suffix, so a rule or agent
      # named otherwise cannot be installed from apm.yml.
      - id: rules-end-in-instructions-md
        name: rules end in .instructions.md
        entry: "apm installs a rule only as rules/<name>.instructions.md; rename"
        language: fail
        files: ^rules/
        exclude: \.instructions\.md$
      - id: agents-end-in-agent-md
        name: agents end in .agent.md
        entry: "apm installs an agent only as agents/<name>.agent.md; rename"
        language: fail
        files: ^agents/
        exclude: \.agent\.md$
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-added-large-files
      - id: check-json
      - id: check-ast
      - id: check-merge-conflict
      - id: check-yaml
        args: [--unsafe]
      - id: debug-statements
      - id: detect-private-key
      - id: end-of-file-fixer
  - repo: https://github.com/astral-sh/uv-pre-commit
    rev: 0.9.18
    hooks:
      - id: uv-lock
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.11.5
    hooks:
      - id: ruff
        args: [ --fix ]
      - id: ruff-format
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: 'v1.15.0'
    hooks:
      - id: mypy
        additional_dependencies: [pydantic, pytest-mypy, types-PyYAML, types-aiofiles]
        args: [--ignore-missing-imports, --check-untyped-defs]
